services:
  - type: web
    name: usemeridian-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: "pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate"
    startCommand: "gunicorn config.wsgi:application --bind 0.0.0.0:$PORT"
    envVars:
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: CERTIFICATE_ENCRYPTION_KEY
        sync: false
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: usemeridian-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: usemeridian-cache
          property: connectionString
      - key: CORS_ALLOWED_ORIGINS
        value: "https://lameridian.vercel.app"

  # Shared cache for GET-response caching and cross-instance rate limiting.
  # The app falls back to local-memory cache if this isn't provisioned, so it's
  # safe to omit; provisioning it just makes caching/limits work across instances.
  - type: keyvalue
    name: usemeridian-cache
    plan: free
    ipAllowList: []

databases:
  - name: usemeridian-db
    plan: free
